# Produktions- bzw. Staging-Betrieb auf einem einzelnen Server.
# Wird von .github/workflows/deploy.yml auf den Server kopiert und gestartet.
# Erwartet /opt/tapperl/.env (von cloud-init angelegt, siehe deploy/cloud-init.yml).
name: tapperl

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tapperl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fehlt}
      POSTGRES_DB: tapperl
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapperl -d tapperl"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    env_file: /opt/tapperl/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tapperl:${POSTGRES_PASSWORD}@postgres:5432/tapperl
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      WEB_URL: https://${WEB_HOST}
      DASHBOARD_URL: https://${DASHBOARD_HOST}
      API_PUBLIC_URL: https://${API_HOST}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18

  web:
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_WEB_URL: https://${WEB_HOST}
        NEXT_PUBLIC_DASHBOARD_URL: https://${DASHBOARD_HOST}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on: [api]

  dashboard:
    build:
      context: ..
      target: dashboard
      args:
        NEXT_PUBLIC_WEB_URL: https://${WEB_HOST}
        NEXT_PUBLIC_DASHBOARD_URL: https://${DASHBOARD_HOST}
        NEXT_PUBLIC_API_DOCS_URL: https://${API_HOST}/docs
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on: [api]

  # TLS-Zertifikate holt Caddy automatisch von Let's Encrypt, sobald die DNS-Einträge stimmen.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      WEB_HOST: ${WEB_HOST}
      DASHBOARD_HOST: ${DASHBOARD_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web, dashboard, api]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
